name: Build Pipeline Calculator with Overlap Analysis

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    # Build on the oldest supported Sales OS; run this same app on newer OSes.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      # Reverse-DNS bundle identifier (recommended; required if you later notarize).
      BUNDLE_ID: "com.archaerial.pipelinecalculator"
      # Build the modular (refactored) GUI by default in CI.
      PIPELINE_CALCULATOR_BUILD_IMPL: "new"
      ARTIFACT_ARCH: arm64
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: arm64
        cache: "pip"

    - name: Build app
      run: bash scripts/ci/macos_build.sh

    - name: Upload macOS test report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results-macos-arm64
        path: |
          .validation-output/build-dependencies.txt
          .validation-output/macos-bundle.json
          .validation-output/ci-test-results.xml
          .validation-output/packaged-smoke/
        include-hidden-files: true
        if-no-files-found: warn

    - name: Detect signing readiness
      id: signing_ready
      shell: bash
      env:
        MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      run: |
        if [[ -n "${MACOS_CERT_P12}" && -n "${MACOS_CERT_PASSWORD}" ]]; then
          echo "enabled=true" >> "${GITHUB_OUTPUT}"
          echo "Code signing enabled."
        else
          echo "enabled=false" >> "${GITHUB_OUTPUT}"
          echo "Code signing disabled: one or more secrets missing."
        fi

    - name: Enforce code signing on main and tags
      if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && steps.signing_ready.outputs.enabled != 'true' }}
      run: |
        echo "::error::Code signing secrets are required for main/tag distribution artifacts."
        echo "::error::Provide MACOS_CERT_P12 and MACOS_CERT_PASSWORD."
        exit 1

    - name: Sign + package DMG (optional)
      if: ${{ steps.signing_ready.outputs.enabled == 'true' }}
      run: bash scripts/ci/macos_sign_and_package.sh
      env:
        MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

    - name: Package DMG (unsigned)
      if: ${{ steps.signing_ready.outputs.enabled != 'true' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
      run: bash scripts/ci/macos_package.sh

    - name: Upload macOS DMG
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: macos-DMG
        path: dist/Pipeline_Calculator_v*.dmg
        if-no-files-found: error

    - name: Upload macOS app
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: macos-APP
        # A ZIP created by ditto preserves app executable bits and symlinks.
        path: dist/Pipeline_Calculator_v*.app.zip
        if-no-files-found: error

    - name: Upload signed macOS smoke report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: signed-smoke-macos-arm64
        path: .validation-output/packaged-smoke-signed/
        include-hidden-files: true
        if-no-files-found: ignore

  verify-newer-macos:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            os_major: '26'
          # The published xcode-27 image currently runs macOS 27. The helper
          # asserts the actual OS, so an SDK label cannot falsely pass this gate.
          - runner: xcode-27
            os_major: '27'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: arm64
    - uses: actions/download-artifact@v4
      with:
        name: macos-APP
        path: .validation-output/downloaded-app
    - name: Verify the distributed app on this macOS release
      shell: bash
      run: |
        set -euo pipefail
        archives=(.validation-output/downloaded-app/*.app.zip)
        [[ ${#archives[@]} -eq 1 && -f "${archives[0]}" ]]
        version="$(python src/pipeline_calculator/versioning.py)"
        bash scripts/ci/macos_verify_distribution.sh "${archives[0]}" \
          '${{ matrix.os_major }}' "$version" .validation-output/distribution-runtime
    - name: Upload macOS runtime verification
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: distribution-runtime-macos-${{ matrix.os_major }}-arm64
        path: |
          .validation-output/distribution-runtime/runtime.json
          .validation-output/distribution-runtime/smoke/
        include-hidden-files: true
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Build the modular (refactored) GUI by default in CI.
      PIPELINE_CALCULATOR_BUILD_IMPL: "new"
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: "pip"

    - name: Build Windows executable
      shell: pwsh
      run: |
        ./scripts/ci/windows_build.ps1
        
    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: dist/Pipeline_Calculator_v*.exe
        if-no-files-found: error

    - name: Upload Windows test report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results-windows
        path: |
          .validation-output/build-dependencies.txt
          .validation-output/ci-test-results.xml
          .validation-output/packaged-smoke/
        include-hidden-files: true
        if-no-files-found: warn

  create-release:
    needs: [build-macos, build-windows, verify-newer-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          macos-DMG/Pipeline_Calculator_v*.dmg
          windows-exe/Pipeline_Calculator_v*.exe
        # Notarization/stapling is manual; review artifacts before distribution.
        draft: true
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

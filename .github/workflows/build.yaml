name: Build Pipeline Calculator with Overlap Analysis

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    # Pin a specific runner to avoid surprises when `macos-latest` advances.
    runs-on: macos-14
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      # Reverse-DNS bundle identifier (recommended; required if you later notarize).
      BUNDLE_ID: "com.archaerial.pipelinecalculator"
      # Build the modular (refactored) GUI by default in CI.
      PIPELINE_CALCULATOR_BUILD_IMPL: "new"
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: "pip"

    - name: Build app
      run: bash scripts/ci/macos_build.sh

    - name: Upload macOS test report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results-macos
        path: .validation-output/ci-test-results.xml
        include-hidden-files: true
        if-no-files-found: warn

    - name: Detect signing readiness
      id: signing_ready
      shell: bash
      env:
        MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      run: |
        if [[ -n "${MACOS_CERT_P12}" && -n "${MACOS_CERT_PASSWORD}" ]]; then
          echo "enabled=true" >> "${GITHUB_OUTPUT}"
          echo "Code signing enabled."
        else
          echo "enabled=false" >> "${GITHUB_OUTPUT}"
          echo "Code signing disabled: one or more secrets missing."
        fi

    - name: Enforce code signing on main and tags
      if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && steps.signing_ready.outputs.enabled != 'true' }}
      run: |
        echo "::error::Code signing secrets are required for main/tag distribution artifacts."
        echo "::error::Provide MACOS_CERT_P12 and MACOS_CERT_PASSWORD."
        exit 1

    - name: Sign + package DMG (optional)
      if: ${{ steps.signing_ready.outputs.enabled == 'true' }}
      run: bash scripts/ci/macos_sign_and_package.sh
      env:
        MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

    - name: Package DMG (unsigned)
      if: ${{ steps.signing_ready.outputs.enabled != 'true' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
      run: bash scripts/ci/macos_package.sh

    - name: Upload macOS DMG
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-calculator-macos
        path: dist/Pipeline_Calculator_v*.dmg
        if-no-files-found: error

    - name: Upload macOS app
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-calculator-macos-app
        path: dist/Pipeline_Calculator.app
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      # Build the modular (refactored) GUI by default in CI.
      PIPELINE_CALCULATOR_BUILD_IMPL: "new"
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: "pip"

    - name: Build Windows executable
      shell: pwsh
      run: |
        ./scripts/ci/windows_build.ps1
        
    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: dist/Pipeline_Calculator_v*.exe

    - name: Upload Windows test report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results-windows
        path: .validation-output/ci-test-results.xml
        include-hidden-files: true
        if-no-files-found: warn

  create-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          pipeline-calculator-macos/Pipeline_Calculator_v*.dmg
          windows-exe/Pipeline_Calculator_v*.exe
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
